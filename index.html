<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Pulse 动态墙 — 纯前端的本地动态发布与浏览示例" />
  <title>Pulse · 动态墙</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233DDC97'/%3E%3Cstop offset='0.62' stop-color='%234F8CFF'/%3E%3Cstop offset='1' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2306140d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="decor" aria-hidden="true">
    <span class="decor__blob decor__blob--green"></span>
    <span class="decor__blob decor__blob--blue"></span>
    <span class="decor__grid"></span>
  </div>

  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"><span class="brand__dot"></span></span>
        <div class="brand__text">
          <h1 class="brand__name">Pulse</h1>
          <p class="brand__tagline">动态墙 · 本地存储</p>
        </div>
      </div>
      <div class="count-chip">
        <span class="count-chip__dot" aria-hidden="true"></span>
        <span id="post-count">0 条动态</span>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="composer" aria-label="发布动态">
      <form id="composer-form" class="composer__form" novalidate>
        <div class="composer__top">
          <span class="avatar avatar--me" aria-hidden="true">你</span>
          <label class="sr-only" for="composer-input">动态内容</label>
          <textarea
            id="composer-input"
            class="composer__input"
            rows="2"
            maxlength="400"
            placeholder="说点什么…"
            autocomplete="off"
          ></textarea>
        </div>
        <div class="composer__footer">
          <p class="composer__hint" id="composer-hint" role="status" aria-live="polite"></p>
          <div class="composer__actions">
            <span class="counter" id="char-counter"><span id="char-used">0</span>/<span id="char-max">280</span></span>
            <button type="submit" class="btn-publish" id="publish-btn" disabled>
              <svg class="btn-publish__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 12.5 20 4l-5.5 16-3.2-6.3L4 12.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
              </svg>
              发布
            </button>
          </div>
        </div>
      </form>
    </section>

    <section class="timeline" aria-label="动态时间线">
      <div class="timeline__meta">
        <h2 class="timeline__title">时间线</h2>
        <span class="timeline__order">最新在前</span>
      </div>

      <div class="empty-state" id="empty-state">
        <div class="empty-state__art" aria-hidden="true">
          <span class="bubble bubble--1"></span>
          <span class="bubble bubble--2"></span>
          <span class="bubble bubble--3"></span>
        </div>
        <p class="empty-state__title">这里还很安静</p>
        <p class="empty-state__text">发布你的第一条动态，开始记录</p>
      </div>

      <div class="feed" id="feed" role="feed" aria-busy="false"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Pulse · 数据保存在此浏览器本地，清除浏览器数据会一并删除</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
